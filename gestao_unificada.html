<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GJ Store — Gestão Unificada</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══ VARIÁVEIS ══════════════════════════════════════════════════════ */
:root {
  --g: #00e676; --c: #00bcd4; --o: #ff6d00; --r: #f44336;
  --dark: #04090f; --d1: #060c18; --d2: #08111f;
  --d3: #0b1728; --d4: #0f1e34; --d5: #141f38;
  --text: #e2f4ff; --muted: rgba(226,244,255,.4);
  --border: rgba(0,230,118,.1);
  --H: 'Syne', sans-serif; --B: 'DM Sans', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{background:var(--dark);color:var(--text);font-family:var(--B);min-height:100dvh}

/* ══ ATMO ══════════════════════════════════════════════════════════ */
#atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.07}
.o1{width:340px;height:340px;background:#00e676;top:-100px;left:-100px;animation:oa 16s ease-in-out infinite alternate}
.o2{width:260px;height:260px;background:#00bcd4;bottom:-60px;right:-80px;animation:ob 12s ease-in-out infinite alternate}
@keyframes oa{to{transform:translate(50px,40px)}}
@keyframes ob{to{transform:translate(-40px,25px)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ══ LOGIN ══════════════════════════════════════════════════════════ */
#loginScreen{position:fixed;inset:0;z-index:999;background:var(--dark);display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{background:var(--d2);border:1px solid var(--border);border-radius:20px;padding:36px 28px;width:100%;max-width:360px;animation:fu .4s ease}
.lgj{font-family:var(--H);font-weight:900;font-size:48px;background:linear-gradient(135deg,var(--g),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;line-height:1}
.lsub{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;margin-bottom:28px}
.linp{width:100%;background:var(--d3);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:var(--B);font-size:14px;outline:none;margin-bottom:10px}
.linp:focus{border-color:var(--g)}
.lbtn{width:100%;background:var(--g);color:#000;border:none;border-radius:12px;padding:14px;font-family:var(--H);font-weight:800;font-size:16px;cursor:pointer;margin-top:6px}
.lerr{font-size:12px;color:var(--r);text-align:center;min-height:18px;margin-bottom:4px}

/* ══ APP SHELL ══════════════════════════════════════════════════════ */
#app{display:none;position:relative;z-index:1;min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(4,9,15,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.topbar-brand{font-family:var(--H);font-weight:900;font-size:18px;background:linear-gradient(90deg,var(--g),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-op{font-size:12px;color:var(--muted)}
.tbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.tbtn:hover{border-color:var(--g);color:var(--g)}

/* ══ CONTENT ══════════════════════════════════════════════════════ */
.content{padding:14px 14px 100px;max-width:740px;margin:0 auto}

/* ══ KPI STRIP ══════════════════════════════════════════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi-card{background:var(--d2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.kpi-card:hover{border-color:var(--g)}
.kpi-card.act{border-color:var(--g);background:rgba(0,230,118,.06)}
.kpi-icon{font-size:15px;margin-bottom:3px}
.kpi-val{font-family:var(--H);font-size:16px;font-weight:900;line-height:1;margin-bottom:2px}
.kpi-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* ══ FILTROS ══════════════════════════════════════════════════════ */
.filter-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:10px}
.filter-bar::-webkit-scrollbar{display:none}
.fb{background:var(--d3);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 13px;font-size:12px;white-space:nowrap;cursor:pointer;transition:all .2s}
.fb.on{background:rgba(0,230,118,.14);color:var(--g);border-color:rgba(0,230,118,.4)}

.sch-wrap{position:relative;margin-bottom:10px}
.sch-wrap input{width:100%;background:var(--d2);border:1.5px solid var(--border);border-radius:12px;padding:9px 14px 9px 36px;color:var(--text);font-family:var(--B);font-size:13px;outline:none}
.sch-wrap input:focus{border-color:var(--g)}
.sch-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4;font-size:14px;pointer-events:none}

/* ══ CARDS DE PEDIDO ══════════════════════════════════════════════ */
.ped-card{
  background:var(--d2);border:1px solid var(--border);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;
  animation:fu .2s ease;
}
.ped-card.overdue{border-color:rgba(244,67,54,.4);background:rgba(244,67,54,.03)}
.ped-card.alert-saldo{border-color:rgba(255,109,0,.45)}
.ped-card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;cursor:pointer}
.ped-id{font-size:11px;font-weight:800;color:var(--c)}
.ped-age{font-size:10px;color:var(--muted);background:var(--d3);padding:2px 6px;border-radius:6px}
.ped-status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:auto}
.ped-nome{font-size:14px;font-weight:700;margin-bottom:3px;cursor:pointer}
.ped-tel{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
.ped-itens{font-size:12px;color:var(--muted);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ped-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ped-total{font-family:var(--H);font-size:16px;font-weight:900;color:var(--g)}
.ped-saldo-info{display:flex;align-items:center;gap:6px}
.pg-wrap{width:60px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;flex-shrink:0}
.pg-fill{height:100%;background:var(--c);border-radius:2px;transition:width .4s}
.tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}

/* Alerta saldo */
.entregue-alert{
  background:rgba(255,109,0,.12);border:1px solid rgba(255,109,0,.35);
  border-radius:8px;padding:6px 10px;margin:6px 0;
  font-size:11px;font-weight:700;color:#ff6d00;
  display:flex;align-items:center;gap:6px;
}

/* Ações do card */
.ped-btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;padding-top:8px;border-top:1px solid var(--border)}
.pb{background:var(--d3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--B)}
.pb:hover{border-color:var(--g);color:var(--g)}
.pb-next{background:rgba(0,230,118,.1);color:var(--g);border-color:rgba(0,230,118,.3)}
.pb-bx{background:rgba(0,188,212,.1);color:var(--c);border-color:rgba(0,188,212,.3)}
.pb-wpp{background:rgba(37,211,102,.1);color:#25d366;border-color:rgba(37,211,102,.3)}
.pb-can{background:rgba(244,67,54,.1);color:var(--r);border-color:rgba(244,67,54,.3)}
.pb-rec{background:rgba(0,230,118,.12);color:var(--g);border-color:rgba(0,230,118,.3)}

/* ══ BAIXA INLINE (colapsável no card) ════════════════════════════ */
.bx-inline{
  display:none;background:var(--d3);border-radius:10px;
  padding:11px 12px;margin-top:8px;border:1px solid rgba(0,188,212,.2);
  animation:fu .18s ease;
}
.bx-inline.open{display:block}
.bx-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
.bx-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px}
.bx-inp{background:var(--d2);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-family:var(--B);font-size:13px;outline:none;width:100%}
.bx-inp:focus{border-color:var(--c)}
.bx-preview{font-size:11px;color:var(--c);margin-bottom:6px;min-height:16px}
.bx-status-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.bso{background:var(--d2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .15s}
.bso.on{background:rgba(0,230,118,.15);color:var(--g);border-color:rgba(0,230,118,.4)}
.bso.on-r{background:rgba(244,67,54,.15);color:var(--r);border-color:rgba(244,67,54,.4)}
.bso.on-o{background:rgba(255,109,0,.15);color:var(--o);border-color:rgba(255,109,0,.4)}
.bx-confirm{
  width:100%;background:var(--c);color:#000;border:none;
  border-radius:10px;padding:10px;font-family:var(--H);font-weight:800;
  font-size:14px;cursor:pointer;
}
.bx-confirm:disabled{opacity:.5;cursor:not-allowed}

/* ══ DETAIL OVERLAY ═══════════════════════════════════════════════ */
#detailOverlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.78);
  backdrop-filter:blur(4px);overflow-y:auto;padding:0 0 40px;
  display:none;
}
#detailOverlay.open{display:block}
.det-sheet{
  background:var(--d1);min-height:100vh;padding:16px;
  max-width:640px;margin:0 auto;animation:fu .25s ease;
}
.det-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);
  gap:10px;
}
.det-title-wrap{flex:1;min-width:0}
.det-id{font-size:11px;color:var(--muted);margin-bottom:2px}
.det-total{font-family:var(--H);font-size:26px;font-weight:900}
.det-close{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.3);color:var(--r);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px;flex-shrink:0}

.det-fin-resumo{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.det-cell{background:var(--d2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.det-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.det-val{font-size:13px;font-weight:600}
.det-full{grid-column:1/-1}

.det-sec{margin-bottom:14px}
.det-sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}

/* Timeline */
.tl{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tl::-webkit-scrollbar{display:none}
.tl-step{display:flex;flex-direction:column;align-items:center;min-width:72px;flex:1}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--border);background:var(--d3);position:relative;z-index:1;margin-bottom:4px}
.tl-dot.done{background:rgba(0,230,118,.2);border-color:var(--g)}
.tl-dot.warn{background:rgba(244,67,54,.2);border-color:var(--r)}
.tl-lbl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;text-align:center}
.tl-date{font-size:9px;color:var(--text);text-align:center;margin-top:1px}
.tl-line{flex:1;height:2px;background:var(--border);margin-bottom:20px}
.tl-line.done{background:var(--g)}

/* Det Actions */
.det-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.da{background:var(--d3);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--B)}
.da:hover{border-color:var(--g);color:var(--g)}
.da-next{background:rgba(0,230,118,.12);color:var(--g);border-color:rgba(0,230,118,.3)}
.da-fin{background:rgba(0,230,118,.18);color:var(--g);border-color:rgba(0,230,118,.5)}
.da-can{background:rgba(244,67,54,.1);color:var(--r);border-color:rgba(244,67,54,.3)}
.da-rec{background:rgba(0,230,118,.12);color:var(--g);border-color:rgba(0,230,118,.3)}
.da-wpp{background:rgba(37,211,102,.1);color:#25d366;border-color:rgba(37,211,102,.3)}

/* ══ TOAST / CONFIRM ══════════════════════════════════════════════ */
#toastEl{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  z-index:9999;background:var(--d2);border:1px solid var(--border);
  border-radius:12px;padding:11px 16px;font-size:13px;
  max-width:320px;width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fu .22s ease;
  display:none;
}
#toastEl.err{border-color:rgba(244,67,54,.4);color:var(--r)}
#toastEl.ok{border-color:rgba(0,230,118,.4);color:var(--g)}
#confirmEl{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  z-index:9998;background:var(--d2);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;max-width:320px;width:90vw;
  box-shadow:0 8px 32px rgba(0,0,0,.55);animation:fu .25s ease;
  display:none;
}

/* ══ RECEIPT MODAL ════════════════════════════════════════════════ */
#receiptModal{
  position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,.88);
  overflow-y:auto;padding:16px 0 48px;display:none;
}
#receiptModal.open{display:block}
.rc-btns{width:100%;max-width:400px;margin:0 auto 12px;display:flex;gap:8px;padding:0 8px}
.rc-btn{flex:1;padding:10px;border-radius:10px;font:700 12px var(--B);cursor:pointer;text-align:center;border:none}
.rc-btn-wpp{background:rgba(37,211,102,.2);border:1px solid #25d366!important;color:#25d366;text-decoration:none;display:flex;align-items:center;justify-content:center;border-radius:10px}
.rc-btn-img{background:rgba(0,188,212,.15);border:1px solid rgba(0,188,212,.4)!important;color:#00bcd4}
.rc-btn-prt{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)!important;color:#e2f4ff}
.rc-btn-cls{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.3)!important;color:#f44336}
#rcCard{width:100%;max-width:400px;margin:0 auto;background:#04090f;border-radius:16px;overflow:hidden;border:1px solid #1a2840}
.rc-header{background:linear-gradient(135deg,#00e676 0%,#00bcd4 100%);padding:20px 18px;text-align:center}
.rc-store{font-size:24px;font-weight:900;color:#04090f;letter-spacing:-1px;font-family:'Syne',Arial,sans-serif}
.rc-sub{font-size:11px;font-weight:700;color:#04090f;opacity:.7;margin-top:3px;letter-spacing:.5px}
.rc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.rc-bx-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rc-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0}

/* ══ MEDIA PRINT ══════════════════════════════════════════════════ */
@media print {
  body > *:not(#receiptModal){display:none!important}
  #receiptModal{position:static!important;background:#fff!important;overflow:visible!important;padding:0!important;display:block!important}
  .rc-btns{display:none!important}
  #rcCard{border:none!important;border-radius:0!important;max-width:100%!important;background:#fff!important;color:#000!important}
  .rc-header{background:#000!important;color:#fff!important}
  .rc-store{color:#fff!important}
  .rc-sub{color:#ccc!important}
}

/* ══ LOADING ══════════════════════════════════════════════════════ */
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:32px 0}
</style>
</head>
<body>

<div id="atmo"><div class="orb o1"></div><div class="orb o2"></div></div>

<!-- ══ LOGIN ══════════════════════════════════════════════════════ -->
<div id="loginScreen">
  <div class="lcard">
    <div class="lgj">GJ</div>
    <div class="lsub">Gestão Unificada · GJ Store</div>
    <div id="lErr" class="lerr"></div>
    <input class="linp" id="lSenha" type="password" placeholder="Senha Admin" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="lbtn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ══ APP ══════════════════════════════════════════════════════════ -->
<div id="app">
  <div id="atmo"><div class="orb o1"></div><div class="orb o2"></div></div>

  <div class="topbar">
    <div class="topbar-brand">GJ Gestão</div>
    <div class="topbar-right">
      <span class="topbar-op" id="topOp"></span>
      <button class="tbtn" onclick="loadAll()">↻ Sync</button>
      <button class="tbtn" onclick="openNovoPedido()">+ Pedido</button>
      <button class="tbtn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="content">
    <!-- KPI Strip -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- Filtro de status -->
    <div class="filter-bar" id="statusBar">
      <button class="fb on" data-s="">Todos</button>
      <button class="fb" data-s="Pendente">⏳ Pendente</button>
      <button class="fb" data-s="Em andamento">⚙️ Andamento</button>
      <button class="fb" data-s="Entregue">📦 Entregue</button>
      <button class="fb" data-s="Finalizado">✅ Finalizado</button>
      <button class="fb" data-s="Cancelado">✕ Cancelado</button>
      <button class="fb" data-s="_saldo">💳 Com Saldo</button>
      <button class="fb" data-s="_atrasado">⏰ Atrasados</button>
    </div>

    <!-- Busca -->
    <div class="sch-wrap">
      <span class="sch-ico">🔍</span>
      <input id="schInp" type="text" placeholder="Buscar por ID, cliente, itens..." oninput="render()">
    </div>

    <!-- Lista de pedidos (Event Delegation aqui) -->
    <div id="guList"></div>
    <div id="loadMore" style="display:none;text-align:center;margin-top:10px">
      <button class="pb" onclick="showMore()">Carregar mais →</button>
    </div>
  </div>
</div>

<!-- ══ DETAIL OVERLAY ══════════════════════════════════════════════ -->
<div id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="det-sheet" id="detSheet">
    <!-- preenchido por openDetail() -->
  </div>
</div>

<!-- ══ RECEIPT MODAL ═══════════════════════════════════════════════ -->
<div id="receiptModal">
  <div class="rc-btns" id="rcBtns"></div>
  <div id="rcCard"></div>
</div>

<!-- ══ TOAST / CONFIRM ════════════════════════════════════════════ -->
<div id="toastEl"></div>
<div id="confirmEl"></div>

<script src="config.js"></script>
<script>
// ── ESTADO ────────────────────────────────────────────────────────
let allPeds = [], allBaixas = [];
let filtStatus = "", filtSearch = "", visibleCount = 30;
let kpiFilter = null;
let currentPed = null, currentBxStatus = "No Prazo";

const PED_PAGE = 30;
const TAXA_DIARIA = 0.33;

// ── API ───────────────────────────────────────────────────────────
function apiGet(action, params = {}) {
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  return fetch(url.toString()).then(r => r.json());
}

// ── FORMATADORES ──────────────────────────────────────────────────
function fmt(v) {
  return "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2 });
}
function fmtK(v) {
  v = Number(v || 0);
  return v >= 1000 ? "R$" + (v / 1000).toFixed(1) + "k" : "R$" + v.toFixed(0);
}
function fmtDT(s, dateOnly) {
  if (!s) return "";
  const str = String(s).trim();
  if (!str) return "";
  if (dateOnly) return str.split(" ")[0];
  return str;
}
function ageDays(p) {
  const parts = String(p["Data/Hora"] || "").split("/");
  if (parts.length < 3) return 0;
  const [d, m, rest] = parts;
  const [y] = rest.split(" ");
  const dt = new Date(+y, +m - 1, +d);
  return isNaN(dt) ? 0 : Math.floor((Date.now() - dt) / 86400000);
}
function diasAtraso(dvStr) {
  if (!dvStr) return 0;
  const parts = String(dvStr).split("/");
  if (parts.length < 3) return 0;
  const dv = new Date(+parts[2], +parts[1] - 1, +parts[0]);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0); dv.setHours(0, 0, 0, 0);
  return Math.max(0, Math.floor((hoje - dv) / 86400000));
}
function statusColor(s) {
  const m = { "Finalizado": "var(--g)", "Em andamento": "var(--c)", "Entregue": "#ab47bc", "Cancelado": "var(--r)", "Pendente": "var(--o)" };
  return m[s] || "var(--muted)";
}

// ── SALDO DO PEDIDO (CÁLCULO UNIFICADO) ───────────────────────────
function calcSaldo(pedId, totalPed) {
  const bxs = allBaixas.filter(b => String(b["ID_Pedido"] || "") === String(pedId));
  const pagas = bxs.filter(b => {
    const st = String(b["Status_Pagamento"] || "");
    return st !== "Pendente" && st !== "Liquidado";
  });
  const pendentes = bxs.filter(b => String(b["Status_Pagamento"] || "") === "Pendente");
  const totalPago = pagas.reduce((s, b) => s + Number(b["Valor_Final_Recebido"] || 0), 0);
  const saldo = Math.max(0, totalPed - totalPago);
  const pct = totalPed > 0 ? Math.min(100, Math.round(totalPago / totalPed * 100)) : 0;
  return { pagas, pendentes, totalPago, saldo, pct, quitado: saldo <= 0.01 };
}

// ── AUTH ──────────────────────────────────────────────────────────
function getSession() {
  try { return JSON.parse(localStorage.getItem("gj_session") || "null"); } catch { return null; }
}
function saveSession(s) { localStorage.setItem("gj_session", JSON.stringify(s)); }

async function doLogin() {
  const senha = document.getElementById("lSenha").value.trim();
  if (!senha) { document.getElementById("lErr").textContent = "Digite a senha"; return; }
  document.getElementById("lErr").textContent = "";
  try {
    const r = await apiGet("adminLogin", { senha });
    if (r.ok) {
      saveSession({ token: r.token || "ok", ts: Date.now(), tipo: "admin", opNome: "Admin" });
      startApp();
    } else {
      document.getElementById("lErr").textContent = r.error || "Senha incorreta";
    }
  } catch { document.getElementById("lErr").textContent = "Erro de conexão"; }
}

function logout() {
  localStorage.removeItem("gj_session");
  location.reload();
}

// ── INIT ──────────────────────────────────────────────────────────
window.addEventListener("load", () => {
  const s = getSession();
  if (s && (Date.now() - s.ts) < 86400000 * 7) { startApp(); return; }
  // Try inheriting session from admin.html
  const adminSess = localStorage.getItem("gj_session");
  if (adminSess) { startApp(); return; }
  document.getElementById("loginScreen").style.display = "flex";
});

function startApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  const s = getSession();
  if (s && s.opNome) document.getElementById("topOp").textContent = "👤 " + s.opNome;
  loadAll();
  setupDelegation();
  setupStatusBar();
}

async function loadAll() {
  document.getElementById("guList").innerHTML = `<div style="padding:32px 0;text-align:center"><div class="spin"></div></div>`;
  try {
    const [rPed, rFin] = await Promise.all([
      apiGet("getPedidos"),
      apiGet("getFinanceiro")
    ]);
    allPeds = (rPed.pedidos || []);
    allBaixas = (rFin.baixas || []);
    render();
    renderKpis();
  } catch {
    document.getElementById("guList").innerHTML = `<div class="empty">Erro ao carregar. Verifique o GAS_URL e tente novamente.</div>`;

// ── FILTROS ───────────────────────────────────────────────────────
function setupStatusBar() {
  document.getElementById("statusBar").addEventListener("click", e => {
    const btn = e.target.closest(".fb");
    if (!btn) return;
    document.querySelectorAll(".fb").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    filtStatus = btn.dataset.s;
    kpiFilter = null;
    document.querySelectorAll(".kpi-card").forEach(k => k.classList.remove("act"));
    visibleCount = PED_PAGE;
    render();
  });
}

function getFiltered() {
  const q = (document.getElementById("schInp")?.value || "").toLowerCase();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return allPeds.filter(p => {
    const id = String(p["ID Pedido"] || "");
    const total = Number(p["Total (R$)"] || 0);
    const status = p["Status"] || "Pendente";

    // KPI overrides
    if (kpiFilter === "_saldo") {
      if (["Finalizado","Cancelado"].includes(status)) return false;
      return !calcSaldo(id, total).quitado;
    }
    if (kpiFilter === "_atrasado") {
      if (["Finalizado","Cancelado"].includes(status)) return false;
      const dv = String(p["Data_Vencimento"] || "").split("/");
      if (dv.length < 3) return false;
      return new Date(+dv[2], +dv[1]-1, +dv[0]) < today && !calcSaldo(id, total).quitado;
    }

    // Filtro status
    if (filtStatus === "_saldo") {
      if (["Finalizado","Cancelado"].includes(status)) return false;
      return !calcSaldo(id, total).quitado;
    }
    if (filtStatus === "_atrasado") {
      if (["Finalizado","Cancelado"].includes(status)) return false;
      const dv = String(p["Data_Vencimento"] || "").split("/");
      if (dv.length < 3) return false;
      return new Date(+dv[2], +dv[1]-1, +dv[0]) < today;
    }
    if (filtStatus && !filtStatus.startsWith("_") && status !== filtStatus) return false;

    // Busca
    if (q) {
      const hay = [id, p["Nome Cliente"], p["Itens"] || ""].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ── RENDER LISTA ──────────────────────────────────────────────────
function render() {
  const filtered = getFiltered();
  const batch = filtered.slice(0, visibleCount);
  const el = document.getElementById("guList");
  if (!batch.length) {
    el.innerHTML = `<div class="empty">Nenhum pedido encontrado</div>`;
    document.getElementById("loadMore").style.display = "none";
    renderKpis();
    return;
  }
  el.innerHTML = batch.map(buildCard).join("");
  document.getElementById("loadMore").style.display = batch.length < filtered.length ? "block" : "none";
  renderKpis();
}

function showMore() { visibleCount += PED_PAGE; render(); }

function buildCard(p) {
  const id = String(p["ID Pedido"] || "");
  const status = p["Status"] || "Pendente";
  const total = Number(p["Total (R$)"] || 0);
  const sc = statusColor(status);
  const isFin = status === "Finalizado";
  const isCan = status === "Cancelado";
  const next = { "Pendente": "Em andamento", "Em andamento": "Entregue", "Entregue": "Finalizado" }[status] || null;
  const { totalPago, saldo, pct, quitado, pendentes } = calcSaldo(id, total);
  const temSaldo = !isFin && !isCan && !quitado && (totalPago > 0 || pendentes.length > 0);
  const isEntregueComSaldo = status === "Entregue" && !quitado;
  const age = ageDays(p);
  const ageTxt = age === 0 ? "hoje" : age + "d";
  const dv = p["Data_Vencimento"] || "";
  const da = diasAtraso(dv);
  const isOverdue = da > 0 && !isFin && !isCan && !quitado;

  // Forma de pagamento badge
  const forma = String(p["Forma Pagamento"] || "").trim();
  const formaShort = forma.replace("Parcelado ", "Parc.").split(" ")[0];
  const fcMap = { PIX: "var(--g)", Dinheiro: "#81c784", Crédito: "var(--c)", Débito: "#4dd0e1", Parc: "#ffb74d", Parcelado: "#ffb74d", Fiado: "var(--r)" };
  const fc = fcMap[formaShort] || "var(--muted)";

  // Itens display
  const itensRaw = String(p["Itens"] || "").trim();
  let itensDisp = "—";
  if (itensRaw && itensRaw !== "[]") {
    try {
      const arr = JSON.parse(itensRaw);
      if (Array.isArray(arr) && arr.length) {
        const ns = arr.map(i => (i.nome || i.name || "?") + (i.qtd > 1 ? " x" + i.qtd : ""));
        itensDisp = ns.slice(0, 2).join(" · ") + (arr.length > 2 ? ` +${arr.length - 2}` : "");
      } else throw 0;
    } catch {
      const ps = itensRaw.split("|").map(s => s.trim()).filter(Boolean);
      itensDisp = ps.slice(0, 2).join(" · ") + (ps.length > 2 ? ` +${ps.length - 2}` : "");
    }
  }

  const idE = id.replace(/'/g, "\\'");
  const tel = String(p["Telefone"] || "").replace(/\D/g, "");
  const nome = String(p["Nome Cliente"] || "").replace(/'/g, "\\'");

  return `<div class="ped-card${isOverdue ? " overdue" : ""}${isEntregueComSaldo ? " alert-saldo" : ""}" style="border-left:3px solid ${sc}" data-id="${id}">
    <div class="ped-card-top" data-open="${idE}">
      <span class="ped-id">#${id}</span>
      <span class="ped-age">${ageTxt}</span>
      ${dv && !isFin && !isCan ? `<span style="font-size:10px;color:${isOverdue ? "var(--r)" : "var(--muted)"}">${isOverdue ? "⚠️" : "📅"} ${fmtDT(dv, true)}${isOverdue ? " +" + da + "d" : ""}</span>` : ""}
      ${forma ? `<span class="tag" style="background:${fc}18;color:${fc};border:1px solid ${fc}33">${formaShort}</span>` : ""}
      <span class="ped-status-badge" style="color:${sc};background:${sc}22">${status}</span>
    </div>
    <div class="ped-nome" data-open="${idE}">${p["Nome Cliente"] || "—"}${p["Telefone"] ? `<span class="ped-tel">📱 ${p["Telefone"]}</span>` : ""}</div>
    <div class="ped-itens" data-open="${idE}">${itensDisp}</div>

    ${isEntregueComSaldo ? `<div class="entregue-alert">📦 PRODUTO ENTREGUE — AGUARDANDO QUITAÇÃO · Saldo: ${fmt(saldo)}</div>` : ""}

    <div class="ped-bottom">
      <span class="ped-total">${fmt(total)}</span>
      ${temSaldo ? `<div class="ped-saldo-info">
        <div class="pg-wrap"><div class="pg-fill" style="width:${pct}%"></div></div>
        <span style="font-size:10px;color:#ffb74d">${pct}% · dev. ${fmt(saldo)}</span>
      </div>` : (quitado && totalPago > 0 ? `<span style="font-size:10px;color:var(--g)">✅ Quitado</span>` : "")}
    </div>

    <div class="ped-btns">
      <button class="pb" data-open="${idE}">ℹ️ Detalhes</button>
      ${!isFin && !isCan && next ? `<button class="pb pb-next" data-move="${idE}|${next}">→ ${next}</button>` : ""}
      ${!isFin && !isCan ? `<button class="pb pb-bx" data-bx="${idE}">💰 Baixa</button>` : ""}
      <button class="pb pb-rec" data-rec="${idE}">🧾 Recibo</button>
      ${tel ? `<button class="pb pb-wpp" data-wpp="${tel}|${nome}">💬 WPP</button>` : ""}
      ${isCan ? `<button class="pb" data-move="${idE}|Pendente">↩ Reativar</button>` : ""}
      ${!isFin && !isCan ? `<button class="pb pb-can" data-move="${idE}|Cancelado">✕</button>` : ""}
    </div>

    <!-- BAIXA INLINE -->
    <div class="bx-inline" id="bx-${idE}">
      ${buildBxInline(id, total)}
    </div>
  </div>`;
}

function buildBxInline(pedId, totalPed) {
  const { saldo, quitado } = calcSaldo(pedId, totalPed);
  return `
    <div style="font-size:11px;font-weight:700;color:var(--c);margin-bottom:8px">💰 Registrar Pagamento — #${pedId}</div>
    <div class="bx-status-row" id="bxSr-${pedId}">
      <button class="bso on" data-bxst="${pedId}|No Prazo">✅ No Prazo</button>
      <button class="bso" data-bxst="${pedId}|Antecipado">⚡ Antecipado</button>
      <button class="bso" data-bxst="${pedId}|Atrasado SEM Taxa">⏰ Atrasado</button>
      <button class="bso" data-bxst="${pedId}|Atrasado COM Taxa">⚠️ Com Juros</button>
    </div>
    <div class="bx-row">
      <div style="flex:1">
        <div class="bx-lbl">Valor Pago (R$)</div>
        <input class="bx-inp" id="bxV-${pedId}" type="number" step="0.01" min="0"
          placeholder="${quitado ? "Já quitado" : "Vazio = quitar " + fmt(saldo)}"
          oninput="bxPreview('${pedId}',${totalPed})">
      </div>
      <div style="width:140px">
        <div class="bx-lbl">Data (retroativa)</div>
        <input class="bx-inp" id="bxD-${pedId}" type="date">
      </div>
      <div style="width:80px">
        <div class="bx-lbl">Intervalo (dias)</div>
        <input class="bx-inp" id="bxI-${pedId}" type="number" value="30" min="1">
      </div>
    </div>
    <div class="bx-preview" id="bxP-${pedId}">${quitado ? "✅ Pedido já quitado" : "Deixar vazio quita o saldo: " + fmt(saldo)}</div>
    <button class="bx-confirm" id="bxBtn-${pedId}" onclick="confirmarBaixaInline('${pedId}',${totalPed})"${quitado ? " disabled" : ""}>
      💰 Confirmar Pagamento
    </button>`;
}

function bxPreview(pedId, totalPed) {
  const { saldo } = calcSaldo(pedId, totalPed);
  const digitado = Number(document.getElementById("bxV-" + pedId)?.value) || 0;
  const el = document.getElementById("bxP-" + pedId);
  if (!el) return;
  if (!digitado) {
    el.textContent = saldo > 0 ? "Vai quitar: " + fmt(saldo) : "Já quitado";
    el.style.color = saldo > 0 ? "var(--g)" : "var(--muted)";
  } else if (digitado >= saldo - 0.01) {
    el.textContent = "✅ Quita o pedido (saldo: " + fmt(saldo) + ")";
    el.style.color = "var(--g)";
  } else {
    el.textContent = "Parcial — saldo restante: " + fmt(saldo - digitado);
    el.style.color = "#ffb74d";
  }
}

// ── EVENT DELEGATION ──────────────────────────────────────────────
function setupDelegation() {
  const list = document.getElementById("guList");
  list.addEventListener("click", e => {
    const t = e.target.closest("[data-open],[data-move],[data-bx],[data-wpp],[data-rec],[data-bxst]");
    if (!t) return;

    if (t.dataset.open !== undefined) { openDetail(t.dataset.open); return; }

    if (t.dataset.move) {
      const [id, status] = t.dataset.move.split("|");
      moverStatus(id, status);
      return;
    }

    if (t.dataset.bx !== undefined) {
      const id = t.dataset.bx;
      const bxEl = document.getElementById("bx-" + id);
      if (bxEl) bxEl.classList.toggle("open");
      return;
    }

    if (t.dataset.wpp) {
      const [tel, nome] = t.dataset.wpp.split("|");
      window.open("https://wa.me/55" + tel + "?text=Olá+" + encodeURIComponent(nome) + "!", "_blank");
      return;
    }

    if (t.dataset.rec !== undefined) {
      showRecibo(t.dataset.rec);
      return;
    }

    if (t.dataset.bxst) {
      const [pedId, st] = t.dataset.bxst.split("|");
      const row = document.getElementById("bxSr-" + pedId);
      if (row) row.querySelectorAll(".bso").forEach(b => b.classList.remove("on", "on-r", "on-o"));
      if (st.includes("Atraso")) t.classList.add(st.includes("COM") ? "on-r" : "on-o");
      else t.classList.add("on");
      return;
    }
  });
}

// ── MOVER STATUS ──────────────────────────────────────────────────
async function moverStatus(pedId, newStatus) {
  if (newStatus === "Finalizado") {
    const ped = allPeds.find(p => String(p["ID Pedido"]) === String(pedId));
    if (!ped) return;
    const total = Number(ped["Total (R$)"] || 0);
    const { totalPago, quitado } = calcSaldo(pedId, total);
    if (!quitado && total > 0) {
      showConfirm(
        `⚠️ <b>Saldo pendente de ${fmt(total - totalPago)}</b>. Finalizar mesmo assim?`,
        "✅ Finalizar (cortesia)",
        "💰 Registrar Baixa",
        () => _doMover(pedId, newStatus),
        () => openDetail(pedId)
      );
      return;
    }
  }
  if (newStatus === "Cancelado") {
    showConfirm("Cancelar pedido #" + pedId + "?", "✕ Cancelar", "Não",
      () => _doMover(pedId, newStatus), null);
    return;
  }
  _doMover(pedId, newStatus);
}

async function _doMover(pedId, status) {
  try {
    const res = await apiGet("atualizarStatus", { id: pedId, status });
    if (res.ok) {
      allPeds = allPeds.map(p => String(p["ID Pedido"]) === String(pedId) ? { ...p, Status: status } : p);
      render();
      toast("Status: " + status + " ✅", "ok");
      // Oferecer WPP
      const ped = allPeds.find(p => String(p["ID Pedido"]) === String(pedId));
      if (ped && ped["Telefone"] && ["Em andamento","Entregue","Finalizado"].includes(status)) {
        offerWpp(ped, status);
      }
      // Se detail aberto para este pedido, atualizar
      if (currentPed && String(currentPed["ID Pedido"]) === String(pedId)) {
        currentPed = { ...currentPed, Status: status };
        renderDetailActions();
      }
    } else toast(res.error || "Erro", "err");
  } catch { toast("Erro de conexão", "err"); }
}

// ── BAIXA INLINE ──────────────────────────────────────────────────
async function confirmarBaixaInline(pedId, totalPed) {
  const btn = document.getElementById("bxBtn-" + pedId);
  const valorRaw = document.getElementById("bxV-" + pedId)?.value;
  const dataVal = document.getElementById("bxD-" + pedId)?.value;
  const intervalo = Number(document.getElementById("bxI-" + pedId)?.value) || 30;
  // Pega status selecionado
  const bxSrEl = document.getElementById("bxSr-" + pedId);
  let bxStatus = "No Prazo";
  if (bxSrEl) {
    const onBtn = bxSrEl.querySelector(".bso.on, .bso.on-r, .bso.on-o");
    if (onBtn) bxStatus = onBtn.dataset.bxst.split("|")[1];
  }

  const ped = allPeds.find(p => String(p["ID Pedido"]) === String(pedId));
  const dvStr = ped ? (ped["Data_Vencimento"] || "") : "";
  const da = diasAtraso(dvStr);

  if (btn) { btn.disabled = true; btn.textContent = "⏳ Processando..."; }

  const params = { idPedido: pedId, statusPagamento: bxStatus, diasAtraso: da, intervaloDias: intervalo };
  if (valorRaw !== "" && valorRaw !== undefined) params.valorPago = Number(valorRaw);
  if (dataVal) params.dataBaixa = dataVal;

  try {
    const res = await apiGet("darBaixa", params);
    if (res.ok) {
      // Atualiza cache local antes do próximo render
      await refreshBaixasPedido(pedId);
      allPeds = allPeds.map(p =>
        String(p["ID Pedido"]) === String(pedId)
          ? { ...p, Status: res.parcial ? (p["Status"] === "Entregue" ? "Entregue" : "Em andamento") : "Finalizado" }
          : p
      );
      render();
      if (res.parcial) {
        toast("Baixa parcial ✅ · Pago: " + fmt(res.valorPago) + " · Saldo: " + fmt(res.saldoRestante), "ok");
      } else {
        toast("Quitado ✅ · Total: " + fmt(res.valorFinal || totalPed), "ok");
        showRecibo(pedId);
      }
    } else toast(res.error || "Erro ao registrar baixa", "err");
  } catch { toast("Erro de conexão", "err"); }

  if (btn) { btn.disabled = false; btn.textContent = "💰 Confirmar Pagamento"; }
}

async function refreshBaixasPedido(pedId) {
  try {
    const res = await apiGet("getParcelasPedido", { idPedido: pedId });
    if (!res || !Array.isArray(res.parcelas)) return;
    allBaixas = allBaixas.filter(b => String(b["ID_Pedido"] || "") !== String(pedId));
    res.parcelas.forEach(parc => {
      allBaixas.push({
        "ID_Baixa": parc.id,
        "ID_Pedido": String(pedId),
        "Nome_Cliente": parc.nomeCliente,
        "Valor_Original": String(parc.valor),
        "Status_Pagamento": parc.status,
        "Dias_Atraso": String(parc.diasAtraso),
        "Taxa_Aplicada_RS": String(parc.taxaRS),
        "Valor_Final_Recebido": String(parc.valorPago),
        "Data_Baixa_Efetiva": parc.dataPagamento,
        "Saldo_Restante": String(parc.saldoRestante),
        "Proxima_Vencimento": parc.vencimento,
        "Telefone": parc.telefone
      });
    });
  } catch {}
}

// ── KPI STRIP ─────────────────────────────────────────────────────
function renderKpis() {
  const el = document.getElementById("kpiGrid");
  if (!el) return;
  const today = new Date();
  const todayStr = ("0"+today.getDate()).slice(-2)+"/"+("0"+(today.getMonth()+1)).slice(-2)+"/"+today.getFullYear();
  const activeStatuses = ["Pendente", "Em andamento", "Entregue"];

  const ativos = allPeds.filter(p => activeStatuses.includes(p["Status"] || ""));
  let aReceber = 0, atrasados = 0;
  ativos.forEach(p => {
    const id = String(p["ID Pedido"] || "");
    const total = Number(p["Total (R$)"] || 0);
    const { saldo, quitado } = calcSaldo(id, total);
    if (!quitado) aReceber += saldo;
    const dvParts = String(p["Data_Vencimento"] || "").split("/");
    if (dvParts.length === 3 && !quitado) {
      const dv = new Date(+dvParts[2], +dvParts[1]-1, +dvParts[0]);
      if (dv < today) atrasados++;
    }
  });

  let hojeVal = 0;
  allBaixas.forEach(b => {
    const dt = String(b["Data_Baixa_Efetiva"] || "");
    const st = String(b["Status_Pagamento"] || "");
    if (dt.startsWith(todayStr) && st !== "Pendente" && st !== "Liquidado") {
      hojeVal += Number(b["Valor_Final_Recebido"] || 0);
    }
  });

  const cards = [
    { icon:"📦", val: ativos.length, lbl:"Ativos", color:"var(--g)", filter: null, tab: "" },
    { icon:"💰", val: fmtK(aReceber), lbl:"A receber", color:"var(--c)", filter:"_saldo" },
    { icon:"⚠️", val: atrasados, lbl:"Atrasados", color:"#f44336", filter:"_atrasado" },
    { icon:"✅", val: fmtK(hojeVal), lbl:"Hoje", color:"#b2ff59", filter: null },
  ];

  el.innerHTML = cards.map(c => `
    <div class="kpi-card${kpiFilter === c.filter && c.filter ? " act" : ""}" onclick="setKpiFilter('${c.filter || ""}')">
      <div class="kpi-icon">${c.icon}</div>
      <div class="kpi-val" style="color:${c.color}">${c.val}</div>
      <div class="kpi-lbl">${c.lbl}</div>
    </div>`).join("");
}

function setKpiFilter(f) {
  kpiFilter = (kpiFilter === f || !f) ? null : f;
  if (kpiFilter) {
    filtStatus = "";
    document.querySelectorAll(".fb").forEach(b => b.classList.remove("on"));
    document.querySelector('.fb[data-s=""]')?.classList.add("on");
  }
  visibleCount = PED_PAGE;
  render();
}

// ── DETAIL OVERLAY ────────────────────────────────────────────────

        <button class="bso on" data-dxst="No Prazo" onclick="selDetBxSt(this,'No Prazo')">✅ No Prazo</button>

        <div style="flex:1"><div class="bx-lbl">Valor Pago (R$)</div>

            oninput="detBxPreview(${total})"></div>
        <div style="width:150px"><div class="bx-lbl">Data (retroativa)</div><input class="bx-inp" id="detBxD" type="date"></div>

function renderDetailBaixas(pedId, totalPed) {
  const el = document.getElementById("detBxHist");
  if (!el) return;
  const { pagas, pendentes, totalPago, saldo, pct, quitado } = calcSaldo(pedId, totalPed);
  if (!pagas.length && !pendentes.length) {
    el.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 0">Nenhum pagamento registrado</div>`;
    return;
  }
  const mkRow = (b, isPend, num) => {
    const vl = Number(isPend ? (b["Saldo_Restante"] || b["Valor_Original"] || 0) : (b["Valor_Final_Recebido"] || 0));
    const st = b["Status_Pagamento"] || "";
    const dt = isPend ? (b["Proxima_Vencimento"] || "—") : (b["Data_Baixa_Efetiva"] || "—");
    const cor = isPend ? "#f44336" : (st.includes("Atraso") ? "#ffb74d" : "#00e676");
    return `<div class="rc-bx-row">
      <div class="rc-num" style="background:${cor}20;border:1.5px solid ${cor}55;color:${cor}">${num}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;font-weight:600;color:${cor}">${isPend ? "⏳ Vence: " + dt : "✅ " + dt}</div>
        <div style="font-size:10px;color:var(--muted)">${st}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:13px;font-weight:800;color:${cor}">${fmt(vl)}</div>
        <div style="font-size:9px;color:var(--muted)">${isPend ? "a pagar" : "pago"}</div>
      </div>
    </div>`;
  };

  el.innerHTML = `
    <div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;color:var(--muted)">
        <span><b style="color:var(--g)">${pagas.length}</b> paga${pagas.length !== 1 ? "s" : ""} · <b style="color:var(--r)">${pendentes.length}</b> pendente${pendentes.length !== 1 ? "s" : ""}</span>
        <span style="font-weight:700;color:${quitado ? "var(--g)" : "#ffb74d"}">${pct}%</span>
      </div>
      <div style="height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${quitado ? "var(--g)" : "var(--c)"};border-radius:3px"></div>
      </div>
    </div>
    ${[...pagas.map((b,i)=>mkRow(b,false,i+1)), ...pendentes.map((b,i)=>mkRow(b,true,pagas.length+i+1))].join("")}
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);margin-top:4px">
      <span style="font-size:12px;color:var(--muted)">Total pago</span>
      <span style="font-size:13px;font-weight:800;color:var(--g)">${fmt(totalPago)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:${quitado ? "rgba(0,230,118,.1)" : "rgba(244,67,54,.1)"}">
      <div>
        <div style="font-size:13px;font-weight:700;color:${quitado ? "var(--g)" : "var(--r)"}">${quitado ? "✅ Quitado" : "⚠️ Saldo devedor"}</div>
        ${!quitado && pendentes.length ? `<div style="font-size:10px;color:var(--muted)">${pendentes.length} parcela${pendentes.length !== 1 ? "s" : ""} em aberto</div>` : ""}
      </div>
      <span style="font-size:22px;font-weight:900;color:${quitado ? "var(--g)" : "var(--r)"}">${fmt(saldo)}</span>
    </div>`;
}

function selDetBxSt(el, st) {
  document.querySelectorAll("#detBxSr .bso").forEach(b => b.classList.remove("on","on-r","on-o"));
  if (st.includes("Atraso")) el.classList.add(st.includes("COM") ? "on-r" : "on-o");
  else el.classList.add("on");
  // Mostrar info de juros
  const infoEl = document.getElementById("detJurosInfo");
  if (!infoEl || !currentPed) return;
  const total = Number(currentPed["Total (R$)"] || 0);
  const dv = currentPed["Data_Vencimento"] || "";
  const da = diasAtraso(dv);
  if (st === "Atrasado COM Taxa" && da > 0) {
    const juros = total * (TAXA_DIARIA / 100) * da;
    infoEl.textContent = da + " dias de atraso · Juros: " + fmt(juros) + " · Total c/ juros: " + fmt(total + juros);
    infoEl.style.color = "var(--r)";
  } else if (st === "Atrasado SEM Taxa") {
    infoEl.textContent = da > 0 ? da + " dias de atraso · Sem juros" : "Atrasado sem multa";
    infoEl.style.color = "var(--o)";
  } else if (st === "Antecipado") {
    infoEl.textContent = "Pagamento antecipado 🎉";
    infoEl.style.color = "var(--g)";
  } else {
    infoEl.textContent = "Pagamento no prazo ✅";
    infoEl.style.color = "var(--c)";
  }
}

function detBxPreview(totalPed) {
  if (!currentPed) return;
  const id = String(currentPed["ID Pedido"] || "");
  const { saldo } = calcSaldo(id, totalPed);
  const digitado = Number(document.getElementById("detBxV")?.value) || 0;
  const el = document.getElementById("detBxPreview");
  if (!el) return;
  if (!document.getElementById("detBxV")?.value.trim()) {
    el.textContent = saldo > 0 ? "Vai quitar: " + fmt(saldo) : "Já quitado";
    el.style.color = saldo > 0 ? "var(--g)" : "var(--muted)";
  } else if (digitado >= saldo - 0.01) {
    el.textContent = "✅ Quita o pedido";
    el.style.color = "var(--g)";
  } else {
    el.textContent = "Parcial — restante: " + fmt(saldo - digitado);
    el.style.color = "#ffb74d";
  }
}

async function confirmarBaixaDetail() {
  if (!currentPed) return;
  const id = String(currentPed["ID Pedido"] || "");
  const total = Number(currentPed["Total (R$)"] || 0);
  const valorRaw = document.getElementById("detBxV")?.value;
  const dataVal = document.getElementById("detBxD")?.value;
  const intervalo = Number(document.getElementById("detBxI")?.value) || 30;
  const onBtn = document.querySelector("#detBxSr .bso.on, #detBxSr .bso.on-r, #detBxSr .bso.on-o");
  const bxStatus = onBtn ? onBtn.dataset.dxst : "No Prazo";
  const da = diasAtraso(currentPed["Data_Vencimento"] || "");
  const btn = document.getElementById("detBxBtn");
  if (btn) { btn.disabled = true; btn.textContent = "⏳..."; }

  const params = { idPedido: id, statusPagamento: bxStatus, diasAtraso: da, intervaloDias: intervalo };
  if (valorRaw !== "" && valorRaw !== undefined) params.valorPago = Number(valorRaw);
  if (dataVal) params.dataBaixa = dataVal;

  try {
    const res = await apiGet("darBaixa", params);
    if (res.ok) {
      await refreshBaixasPedido(id);
      const newStatus = res.parcial ? (currentPed["Status"] === "Entregue" ? "Entregue" : "Em andamento") : "Finalizado";
      allPeds = allPeds.map(p => String(p["ID Pedido"]) === id ? { ...p, Status: newStatus } : p);
      currentPed = { ...currentPed, Status: newStatus };
      renderDetailBaixas(id, total);
      renderDetailActions();
      render();
      if (res.parcial) {
        toast("Parcial ✅ · Pago: " + fmt(res.valorPago) + " · Saldo: " + fmt(res.saldoRestante), "ok");
      } else {
        toast("Quitado ✅", "ok");
        closeDetail();
        showRecibo(id);
      }
    } else toast(res.error || "Erro", "err");
  } catch { toast("Erro de conexão", "err"); }
  if (btn) { btn.disabled = false; btn.textContent = "💰 Confirmar Pagamento"; }
}

function renderDetailActions() {
  const el = document.getElementById("detActions");
  if (!el || !currentPed) return;
  const id = String(currentPed["ID Pedido"] || "");
  const status = currentPed["Status"] || "";
  const tel = String(currentPed["Telefone"] || "").replace(/\D/g, "");
  const next = { "Pendente": "Em andamento", "Em andamento": "Entregue", "Entregue": "Finalizado" }[status];
  const isFin = status === "Finalizado";
  const isCan = status === "Cancelado";
  let html = "";
  if (next) html += `<button class="da da-next" onclick="detMove('${id}','${next}')">→ ${next}</button>`;
  html += `<button class="da da-rec" onclick="showRecibo('${id}')">🧾 Recibo</button>`;
  if (tel) html += `<button class="da da-wpp" onclick="window.open('https://wa.me/55${tel}','_blank')">💬 WhatsApp</button>`;
  if (!isFin && !isCan) html += `<button class="da da-can" onclick="detMove('${id}','Cancelado')">✕ Cancelar</button>`;
  if (isCan) html += `<button class="da" onclick="detMove('${id}','Pendente')">↩ Reativar</button>`;
  el.innerHTML = html;
}

async function detMove(id, status) {
  await moverStatus(id, status);
  if (currentPed && String(currentPed["ID Pedido"]) === id) {
    currentPed = { ...currentPed, Status: status };
    renderDetailActions();
    const total = Number(currentPed["Total (R$)"] || 0);
    renderDetailBaixas(id, total);
  }
}

function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("open");
  document.body.style.overflow = "";
  currentPed = null;
}

// ── RECIBO ────────────────────────────────────────────────────────
function showRecibo(pedId) {
  const p = allPeds.find(x => String(x["ID Pedido"]) === String(pedId));
  if (!p) return;
  const id = pedId;
  const nome = p["Nome Cliente"] || "—";
  const tel = String(p["Telefone"] || "").replace(/\D/g, "");

  const sub = Number(p["Subtotal (R$)"] || p["Subtotal"] || total);

        }).join("");
      } else throw 0;
    } catch {
      itensHtml = itensRaw.split("|").map(s => `<div class="rc-row"><span style="color:#c8e6f5">• ${s.trim()}</span></div>`).join("");
    }
  }

  // Histórico
  const { pagas, pendentes, totalPago, saldo, pct, quitado } = calcSaldo(id, total);
  const nPagas = pagas.length, nPend = pendentes.length;
  const mkBxRow = (b, isPend, num) => {
    const vl = Number(isPend ? (b["Saldo_Restante"] || b["Valor_Original"] || 0) : (b["Valor_Final_Recebido"] || 0));
    const st = b["Status_Pagamento"] || "";
    const dt = isPend ? (b["Proxima_Vencimento"] || "—") : (b["Data_Baixa_Efetiva"] || "—");
    const cor = isPend ? "#f44336" : (st.includes("Atraso") ? "#ffb74d" : "#00e676");
    return `<div class="rc-bx-row">
      <div class="rc-num" style="background:${cor}20;border:1.5px solid ${cor}55;color:${cor}">${num}</div>
      <div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;color:${cor}">${isPend ? "⏳ Vence: " + dt : "✅ " + dt}</div>
        <div style="font-size:10px;color:#8899aa">${st}</div></div>
      <div style="text-align:right"><div style="font-size:13px;font-weight:800;color:${cor}">${fmt(vl)}</div>
        <div style="font-size:9px;color:#8899aa">${isPend ? "a pagar" : "pago"}</div></div>
    </div>`;
  };
  const bxHtml = [...pagas.map((b,i)=>mkBxRow(b,false,i+1)), ...pendentes.map((b,i)=>mkBxRow(b,true,nPagas+i+1))].join("") ||
    `<div style="font-size:12px;color:#8899aa;padding:6px 0">Nenhum pagamento registrado</div>`;

  // WPP mensagem
  const wppLines = [
    "🧾 *Recibo — GJ Store*", "",
    `👤 *${nome}*${tel ? "  📱 " + tel : ""}`,
    `📋 Pedido: #${id}  •  ${dtPed}`,
    `💳 ${pag}`, "",
  ];
  try {
    const arr = JSON.parse(itensRaw);
    if (Array.isArray(arr)) arr.forEach(i => wppLines.push(`• ${i.nome||i.name} x${i.qtd||1}${i.valor ? " — " + fmt(Number(i.valor)*(i.qtd||1)) : ""}`));
  } catch { itensRaw.split("|").filter(Boolean).forEach(s => wppLines.push("• " + s.trim())); }
  wppLines.push("", desc > 0 ? `Subtotal: ${fmt(sub)}\nDesconto: - ${fmt(desc)}\n` : "", `💰 *Total: ${fmt(total)}*`, "");
  if (pagas.length || pendentes.length) {
    wppLines.push(`📋 *Pagamentos (${nPagas}/${nPagas + nPend}):*`);
    pagas.forEach((b,i) => wppLines.push(`✅ ${i+1}. ${b["Data_Baixa_Efetiva"]||"—"} — ${fmt(b["Valor_Final_Recebido"])} (${b["Status_Pagamento"]})`));
    pendentes.forEach((b,i) => wppLines.push(`⏳ ${nPagas+i+1}. Vence ${b["Proxima_Vencimento"]||"—"} — ${fmt(b["Saldo_Restante"]||b["Valor_Original"]||0)} (Pendente)`));
    wppLines.push("", `✅ *Total pago: ${fmt(totalPago)}*`, quitado ? "✅ *QUITADO*" : `⚠️ *Saldo devedor: ${fmt(saldo)}*`);
  }
  wppLines.push("", "_GJ Store — Obrigado pela preferência 🙏_");
  const wppMsg = encodeURIComponent(wppLines.filter(l => l !== null).join("\n"));

  // Render
  document.getElementById("rcBtns").innerHTML = `
    ${tel ? `<a href="https://wa.me/55${tel}?text=${wppMsg}" target="_blank" class="rc-btn rc-btn-wpp">💬 WPP</a>` : ""}
    <button class="rc-btn rc-btn-img" id="rcImgBtn" onclick="gerarImagemRecibo()">📸 Imagem</button>
    <button class="rc-btn rc-btn-prt" onclick="window.print()">🖨️ Print/PDF</button>
    <button class="rc-btn rc-btn-cls" onclick="document.getElementById('receiptModal').classList.remove('open')">✕</button>`;

  document.getElementById("rcCard").innerHTML = `
    <div class="rc-header">
      <div class="rc-store">GJ STORE</div>
      <div class="rc-sub">RECIBO #${id}</div>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid #1a2840">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:13px;font-weight:700;color:#e2f4ff">${nome}</span>
        ${tel ? `<span style="font-size:11px;color:#8899aa">📱 ${tel}</span>` : ""}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:#8899aa">${dtPed}</span>
        <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(0,188,212,.15);color:#00bcd4;border:1px solid rgba(0,188,212,.3)">${pag}</span>
      </div>
      ${obs ? `<div style="font-size:10px;color:#8899aa;margin-top:4px">📝 ${obs}</div>` : ""}
    </div>
    ${itensHtml ? `<div style="padding:12px 16px;border-bottom:1px solid #1a2840"><div style="font-size:9px;font-weight:700;color:#8899aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">ITENS</div>${itensHtml}</div>` : ""}
    <div style="padding:12px 16px;border-bottom:1px solid #1a2840;background:#060c18">
      ${sub !== total && desc > 0 ? `
      <div class="rc-row" style="color:#8899aa"><span>Subtotal</span><span>${fmt(sub)}</span></div>
      <div class="rc-row" style="color:#00bcd4"><span>Desconto</span><span>- ${fmt(desc)}</span></div>` : ""}
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:#8899aa">TOTAL DO PEDIDO</span>
        <span style="font-size:18px;font-weight:900;color:#e2f4ff">${fmt(total)}</span>
      </div>
    </div>
    ${pagas.length || pendentes.length ? `
    <div style="padding:12px 16px;border-bottom:1px solid #1a2840">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:9px;font-weight:700;color:#8899aa;text-transform:uppercase;letter-spacing:1px">PAGAMENTOS</span>
        <span style="font-size:10px;font-weight:700;color:${quitado?"#00e676":"#ffb74d"}">${pct}%</span>
      </div>
      <div style="height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-bottom:8px">
        <div style="width:${pct}%;height:100%;background:${quitado?"#00e676":"#00bcd4"};border-radius:2px"></div>
      </div>
      ${bxHtml}
    </div>` : ""}
    <div style="padding:14px 16px;background:${quitado?"rgba(0,230,118,.12)":"rgba(244,67,54,.12)"}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;color:#8899aa;margin-bottom:2px">Total pago</div>
          <div style="font-size:15px;font-weight:900;color:#00e676">${fmt(totalPago)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:#8899aa;margin-bottom:2px">${quitado?"Status":"Saldo devedor"}</div>
          <div style="font-size:${quitado?"15":"20"}px;font-weight:900;color:${quitado?"#00e676":"#f44336"}">${quitado?"✅ QUITADO":fmt(saldo)}</div>
        </div>
      </div>
    </div>
    <div style="padding:12px 16px;text-align:center;border-top:1px solid #1a2840">
      <div style="font-size:10px;color:#8899aa">GJ Store · Obrigado pela preferência 🙏</div>
    </div>`;

  document.getElementById("receiptModal").classList.add("open");
}

async function gerarImagemRecibo() {
  if (!window.html2canvas) {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    document.head.appendChild(s);
    await new Promise((res, rej) => { s.onload = res; s.onerror = rej; });
  }
  const btn = document.getElementById("rcImgBtn");
  if (btn) { btn.textContent = "⏳..."; btn.disabled = true; }
  try {
    const canvas = await html2canvas(document.getElementById("rcCard"), { backgroundColor: "#04090f", scale: 2, useCORS: true });
    canvas.toBlob(blob => {
      const file = new File([blob], "recibo-gj.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Recibo GJ Store" }).catch(() => {});
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "recibo-gj.png";
        a.click();
      }
    });
  } catch (e) { toast("Erro ao gerar imagem", "err"); }
  if (btn) { btn.textContent = "📸 Imagem"; btn.disabled = false; }
}

// ── NOVO PEDIDO (redireciona para admin) ──────────────────────────
function openNovoPedido() {
  window.open("admin.html#ped", "_blank");
}

// ── TOAST ─────────────────────────────────────────────────────────
let _toastT;
function toast(msg, type) {
  const el = document.getElementById("toastEl");
  el.innerHTML = msg;
  el.className = type === "err" ? "err" : (type === "ok" ? "ok" : "");
  el.style.display = "block";
  clearTimeout(_toastT);
  _toastT = setTimeout(() => { el.style.display = "none"; }, 3200);
}

function showConfirm(msg, btnA, btnB, cbA, cbB) {
  const el = document.getElementById("confirmEl");
  el.style.display = "block";
  el.innerHTML = `<div style="font-size:13px;margin-bottom:12px">${msg}</div>
    <div style="display:flex;gap:8px">
      <button style="flex:1;background:rgba(0,230,118,.15);border:none;color:var(--g);padding:9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer" id="cfA">${btnA}</button>
      ${btnB ? `<button style="flex:1;background:var(--d3);border:none;color:var(--muted);padding:9px;border-radius:8px;font-size:12px;cursor:pointer" id="cfB">${btnB}</button>` : ""}
    </div>`;
  document.getElementById("cfA").onclick = () => { el.style.display = "none"; if (cbA) cbA(); };
  const cfB = document.getElementById("cfB");
  if (cfB) cfB.onclick = () => { el.style.display = "none"; if (cbB) cbB(); };
}

function offerWpp(ped, status) {
  const msgs = {
    "Em andamento": `Olá ${ped["Nome Cliente"]||""}! 👋\nSeu pedido *${ped["ID Pedido"]}* foi confirmado e está sendo preparado.`,
    "Entregue": `Olá ${ped["Nome Cliente"]||""}! 📦\nSeu pedido *${ped["ID Pedido"]}* foi entregue!`,
    "Finalizado": `Olá ${ped["Nome Cliente"]||""}! ✅\nPedido *${ped["ID Pedido"]}* finalizado. Obrigado pela preferência! 🛒`
  };
  const msg = msgs[status]; if (!msg) { toast("Status atualizado ✅", "ok"); return; }
  const tel = String(ped["Telefone"]||"").replace(/\D/g,"");
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--d2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;z-index:2000;max-width:320px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.5)";
  el.innerHTML = `<div style="font-size:12px;font-weight:700;margin-bottom:8px">✅ → <b>${status}</b> · Avisar?</div>
    <div style="font-size:11px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:8px;padding:8px;margin-bottom:10px;max-height:60px;overflow:auto;white-space:pre-wrap">${msg}</div>
    <div style="display:flex;gap:8px">
      <button id="_wOk" style="flex:1;background:rgba(37,211,102,.18);border:none;color:#25d366;padding:8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">💬 Enviar</button>
      <button id="_wNo" style="flex:1;background:var(--d3);border:none;color:var(--muted);padding:8px;border-radius:8px;font-size:12px;cursor:pointer">Pular</button>
    </div>`;
  document.getElementById("_wOk")?.remove(); // prevent id collision
  document.body.appendChild(el);
  el.querySelector("#_wOk").onclick = () => { window.open("https://wa.me/55"+tel+"?text="+encodeURIComponent(msg),"_blank"); el.remove(); };
  el.querySelector("#_wNo").onclick = () => { el.remove(); toast("Status atualizado ✅","ok"); };
  setTimeout(()=>{ if(el.parentNode){el.remove();toast("Status atualizado ✅","ok");} }, 7000);
}
</script>
